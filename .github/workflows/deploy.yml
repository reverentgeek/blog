# Build with SiteSquatch (no Node toolchain) and deploy the output to Netlify.
#
# Needs repository secrets:
#   NETLIFY_AUTH_TOKEN  a Netlify personal access token
#   NETLIFY_SITE_ID     the site's API ID (Site configuration > General)
# and Netlify's own builds turned off (Site configuration > Build & deploy >
# Continuous deployment > Build settings > Stop builds), so pushes don't build twice.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The SiteSquatch release to install, pinned so a breaking ssqch change can't
  # break a deploy. Bump it on purpose, after a local `pnpm test` passes.
  SSQCH_VERSION: "0.2.1"
  NETLIFY_CLI_VERSION: "23"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The newest Node.js LTS, for fingerprinting assets, pruning images, the
      # smoke test and netlify-cli. check-latest gets the newest patch.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      # ---- SiteSquatch: the prebuilt release binary (static Linux x86_64, with
      # AVIF). The installer checks the archive's SHA-256 checksum, and
      # SSQCH_UNMANAGED_INSTALL puts the binary in .cache/bin without touching
      # shell profiles.
      - name: Install ssqch
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/reverentgeek/sitesquatch/releases/download/v$SSQCH_VERSION/ssqch-installer.sh" \
            | SSQCH_UNMANAGED_INSTALL=.cache/bin sh
          .cache/bin/ssqch --version

      # ---- Responsive images: restored so warm builds encode nothing. The key
      # changes only when a source image changes, so unchanged pushes don't
      # re-upload the cache.
      - id: img-cache
        uses: actions/cache/restore@v6
        with:
          path: dist/img
          # v2: adds AVIF. Falling back to the v1 (WebP/JPEG) cache means only
          # the AVIF files are encoded once, then saved under v2.
          key: img-v2-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.gif', 'src/**/*.webp', 'src/**/*.svg') }}
          restore-keys: |
            img-v2-
            img-v1-
      - id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build-native.sh') }}

      - name: Build
        run: scripts/build-native.sh
        env:
          SSQCH_BIN: .cache/bin/ssqch

      - if: steps.img-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist/img
          key: ${{ steps.img-cache.outputs.cache-primary-key }}
      - if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Smoke test
        run: node --test test/smoke.test.js

      # --no-build: the site is already built. Without it, netlify-cli runs
      # the netlify.toml build (pnpm run build and its plugins) first.
      - name: Deploy to Netlify
        run: npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --prod --no-build --dir dist --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
