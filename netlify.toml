# Netlify builds the site: install the pinned SiteSquatch release (a static
# Linux binary; the installer checks its SHA-256 checksum), run the same
# `pnpm run build` as locally, then the smoke tests, so a failing test stops
# the deploy.
[build]
  command = "curl --proto '=https' --tlsv1.2 -fsSL https://github.com/reverentgeek/sitesquatch/releases/download/v$SSQCH_VERSION/ssqch-installer.sh | SSQCH_UNMANAGED_INSTALL=.cache/bin sh && SSQCH_BIN=.cache/bin/ssqch pnpm run build && node --test test/smoke.test.js"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "24"
  # The SiteSquatch release to install. Bump it on purpose, after a local
  # `pnpm test` passes.
  SSQCH_VERSION = "0.2.6"

# Image derivatives (dist/img) and ssqch's image-hash cache (.cache/ssqch)
# carry over between builds, so a build with no new images encodes nothing.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["dist/img", ".cache/ssqch"]

# Fingerprinted assets (index.<hash>.css, index.<hash>.js, prism.<hash>.js) are safe to
# cache forever: changing the contents changes the filename, so browsers fetch the new
# URL immediately instead of sitting on a stale copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# pco.js is a passthrough copy with a stable filename, so it must stay revalidatable.
# This more specific rule overrides the wildcard above.
[[headers]]
  for = "/assets/pco.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
