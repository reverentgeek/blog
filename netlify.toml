# Netlify builds the site: its `pnpm install` brings SiteSquatch with the other
# packages (the `ssqch` dev dependency, pinned in package.json and the lockfile,
# with its static Linux binary from `@ssqch/linux-x64`), then it runs the same
# `pnpm run build` as locally, then the smoke tests, so a failing test stops the
# deploy.
[build]
  command = "pnpm run build && node --test 'test/*.test.js'"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "24"

# Image derivatives (dist/img) and ssqch's image-hash cache (.cache/ssqch)
# carry over between builds, so a build with no new images encodes nothing.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["dist/img", ".cache/ssqch"]

# Fingerprinted assets (index.<hash>.css, index.<hash>.js) are safe to
# cache forever: changing the contents changes the filename, so browsers fetch the new
# URL immediately instead of sitting on a stale copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# pco.js is a passthrough copy with a stable filename, so it must stay revalidatable.
# This more specific rule overrides the wildcard above.
[[headers]]
  for = "/assets/pco.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
