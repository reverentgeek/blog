# Netlify builds the site: its `pnpm install` brings SiteSquatch with the other
# packages (the `ssqch` dev dependency, pinned in package.json and the lockfile,
# which runs on Node: NODE_VERSION below), then it runs the same
# `pnpm run build` as locally, then the smoke tests, so a failing test stops the
# deploy.
[build]
  command = "pnpm run build && node --test 'test/*.test.js'"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "24"

# ssqch's cache (.cache/ssqch: the encoded images and their hashes, and the
# highlighted code fences) carries over between builds, so a build with no new
# images encodes nothing and one with no new code highlights nothing.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache/ssqch"]

# Fingerprinted assets (index.<hash>.css, index.<hash>.js, pco.<hash>.js) are safe to
# cache forever: changing the contents changes the filename, so browsers fetch the new
# URL immediately instead of sitting on a stale copy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
